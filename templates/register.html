<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up/Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
        </ul>
    </nav>
    <a style="position: relative; left: 1%; top: 15px;" class="back-link" href="/">Back</a>
    <div class="container">
        <h1>Create an Account</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/register" method="post" class="register-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required />
        
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required />
        
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" required />

            <label for="user_type">User Type:</label>
            <select id="user_type" name="user_type" required>
                <option value="">Select User Type</option>
                <option value="teacher">Teacher</option>
                <option value="parent">Parent</option>
                <option value="student">Student</option>
            </select>
        
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required />

            <div class="form-row">
                <div class="form-group">
                    <label for="city">City:</label>
                    <input type="text" id="city" name="city" required />
                </div>
                <div class="form-group">
                    <label for="postcode">Post Code:</label>
                    <input type="text" id="postcode" name="postcode" inputmode="numeric" pattern="[0-9]+" placeholder="e.g 1234" required />
                </div>
            </div>
        
            <label for="country">Country:</label>
            <input type="text" id="country" name="country" required />
        
            <label>Date of Birth:</label>
            <div class="form-row">
                <div class="form-group">
                    <label for="dob_day">Day:</label>
                    <select id="dob_day" name="dob_day" required>
                        <option value="">Day</option>
                        {% for i in range(1, 32) %}
                            <option value="{{ '%02d' % i }}">{{ '%02d' % i }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="dob_month">Month:</label>
                    <select id="dob_month" name="dob_month" required>
                        <option value="">Month</option>
                        {% for i in range(1, 13) %}
                            <option value="{{ '%02d' % i }}">{{ '%02d' % i }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="dob_year">Year:</label>
                    <select id="dob_year" name="dob_year" required>
                        <option value="">Year</option>
                        {% for i in range(1900, today[:4]|int + 1) %}
                            <option value="{{ i }}">{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
                <option value="non-binary">Non-Binary</option>
            </select>
        
            <button type="submit">Sign Up</button>
        </form>        
    </div>
    <footer>
        <p style="text-align: center; margin-top: 20px;">&copy; 2026 SchoolPay. <a href="/about">Learn More</a> <a href="/contact">Contact Us</a></p>
    </footer>
</body>
</html>
