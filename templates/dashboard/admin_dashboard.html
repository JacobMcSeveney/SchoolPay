<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
        </ul>
        <div class="account">
            <ul>
                {% if current_user.is_authenticated %}
                    <li><a href="{{ url_for('logout') }}">Logout</a></li>
                    <li><a class="active" href="{{ url_for('profile') }}">{{ current_user.username }} | Dashboard</a></li>
                {% else %}
                    <li><a href="{{ url_for('login') }}">Login</a></li>
                    <li><a href="{{ url_for('register') }}">Register</a></li>
                {% endif %}
            </ul>
        </div>
        </nav>
        <div class="dashboard-content">
        <h1>Welcome to the Admin Dashboard!</h1>
        <aside class="sidebar">
            <button class="button active" onclick="switchTab('overview')">Overview</button>
            <button class="button" onclick="switchTab('settings')">Settings</button>
        </aside>
        <div id="overview-content" class="tab-content active-tab-content">
            <section class="overview">
                <h2>Overview</h2>
                <div class="container">
                    <h3>Users in System</h3>
                    <p>Total Users: <span id="user-count">0</span></p>
                    <div class="user-list-grid">
                        <ul id="user-list"></ul>
                    </div>
                </div>
            </section>
        </div>

        <div id="settings-content" class="tab-content">
            <section class="settings-section">
                <h2>Settings</h2>
                <p>Settings content will go here.</p>
            </section>
        </div>
    </div>
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.sidebar button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active-tab-content'));
            document.querySelector(`.sidebar button[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`${tabName}-content`).classList.add('active-tab-content');
        }
         fetch('/api/users')
        .then(response => response.json())
        .then(usersData => {
            const list = document.getElementById('user-list');
            const userCountSpan = document.getElementById('user-count');
            let output = '';

            Object.values(usersData).forEach(user => {
            // Make each user item a clickable link to their profile view
            const profileUrl = `/profile/${user.id}`;
                output += `<li class="user-item"><a href="${profileUrl}"><strong>Username:</strong> ${user.username}<br><strong>Email:</strong> ${user.email}<br><strong>User Type:</strong> ${user.user_type}</a></li>`;
            });           
            
            userCountSpan.textContent = Object.keys(usersData).length;

            list.innerHTML = output;
        })
        .catch(error => console.error('Error:', error));
        </script>
    </div>
</body>
</html>
