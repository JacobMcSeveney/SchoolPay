<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
        </ul>
    </nav>

    <a style="position: relative; left: 1%; top: 15px;" class="back-link" href="{{ url_for(dashboard_route) }}">Back</a>

    <div class="container">
        <h1>Payment</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form class="register-form" action="/make_payment" method="post">
            <h2>Payment Details</h2>
            <label for="student_id">Student's Account ID:</label>
            <input type="text" id="student_id" name="student_id" value="{{ prefill_data.student_id if prefill_data.student_id else '' }}" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" title="Enter the student's 6-digit account ID." placeholder="e.g. 123456 (the student's 6-digit account ID)" required >

            <label for="amount">Amount to Pay:</label>
            <input type="number" id="amount" name="amount" min="0.01" step="0.01" value="{{ '%.2f'|format(prefill_data.amount) if prefill_data.amount else '' }}" required placeholder="e.g. 20" {% if prefill_data.fee_id %}readonly{% endif %}>
            {% if prefill_data.fee_id %}
                <p class="hint" style="font-size: 0.85em; color: #666;">This amount is fixed by the fee you're paying and can't be changed.</p>
            {% endif %}

            <input type="hidden" name="fee_id" value="{{ prefill_data.fee_id }}" >
            <input type="hidden" name="fee_name" value="{{ prefill_data.fee_name }}" >

            <h2>Payment Information</h2>
            <label for="card_holder_name" >Card Holder Name:</label>
            <input type="text" id="card_holder_name" name="card_holder_name" required placeholder="e.g. John Doe">
            <label for="card_number">Card Number:</label>
            <input type="text" id="card_number" name="card_number" pattern="[0-9]{13,16}" placeholder="13-16 digits (no spaces)" required >

            <div class="form-row">
                <div class="form-group">
                    <label for="exp_month">Expiry Month:</label>
                    <select id="exp_month" name="exp_month" required>
                        <option value="">Month</option>
                        {% for i in range(1, 13) %}
                            <option value="{{ '%02d' % i }}">{{ '%02d' % i }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="exp_year">Expiry Year:</label>
                    <select id="exp_year" name="exp_year" required>
                        <option value="">Year</option>
                        {% for i in range(current_year, 2100) %}
                            <option value="{{ i }}">{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <label for="cvv">CVV:</label>
            <input type="text" id="cvv" name="cvv" pattern="[0-9]{3,4}" placeholder="3 or 4 digits (no spaces)" required >

            <button type="submit">Complete Payment</button>
        </form>
    </div>
    <footer>
        <p style="text-align: center; margin-top: 20px;">&copy; 2026 SchoolPay. <a href="/about">Learn More</a> <a href="/contact">Contact Us</a></p>
    </footer>
</body>
</html>
