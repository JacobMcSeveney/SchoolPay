<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
        </ul>
    </nav>

    <a style="position: relative; left: 1%; top: 15px;" class="back-link" href="/payment">Back</a>

    <div class="container">
        <h1>Payment Successful!</h1>
        <p>Thank you for your payment. Your transaction has been processed.</p>
        <div class="receipt-box" style="background: #f9f9f9; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <h2>Receipt Details</h2>
            <p><strong>ID:</strong> {{ id if id else 'N/A' }}</p>
            <p><strong>Amount Paid:</strong> ${{ "%.2f"|format(amount) }}</p>
            <p><strong>Transaction ID:</strong> {{ transaction_id }}</p>
        </div>

        <a href="/{user.user_type}_dashboard" class="btn">Return to Dashboard</a>
    </div>
</body>
</html>
