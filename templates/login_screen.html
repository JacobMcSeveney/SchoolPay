<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
        </ul>
        <div class="account">
            <ul>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="logged-in">
        <h1>You are logged in as {{ username }}!</h1>
        <p>Go to your user Dashboard</p>
        {% if user_type == "student" %}
            <a class="button" href="/student_dashboard">Dashboard</a>
        {% elif user_type == "parent" %}
            <a class="button" href="/parent_dashboard">Dashboard</a>
        {% elif user_type == "teacher" %}
            <a class="button" href="/teacher_dashboard">Dashboard</a>
        {% endif %}
    </div>
</body>
</html>
